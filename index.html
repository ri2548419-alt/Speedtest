<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internet Speed Test</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; text-align:center; padding:40px; }
    .card { background:#fff; padding:30px; max-width:400px; margin:auto; border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,.1); }
    button { padding:12px 22px; font-size:18px; border:none; background:#007bff; color:#fff; border-radius:10px; cursor:pointer; }
    button:hover { background:#0056c0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Internet Speed Test</h2>
    <p>নিচের বাটনে ক্লিক করে আপনার ইন্টারনেট স্পিড পরীক্ষা করুন</p>
    <button onclick="window.open('https://www.google.com/search?q=speed+test','_blank')">Start Speed Test</button>
  </div>
</body>
</html>
