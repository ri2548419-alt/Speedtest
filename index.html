<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Test</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; text-align:center; padding:40px; }
    .card { background:#fff; padding:30px; max-width:400px; margin:auto; border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,.1); }
    button { padding:12px 22px; font-size:18px; border:none; background:#007bff; color:#fff; border-radius:10px; cursor:pointer; }
    button:hover { background:#0056c0; }
    .result { font-size:20px; margin-top:20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Internet Speed Test</h2>
    <p>Download Speed পরিমাপ করতে নিচে ক্লিক করুন</p>
    <button onclick="startTest()">Start Test</button>
    <div class="result" id="output"></div>
  </div>

  <script>
    async function startTest() {
      const output = document.getElementById('output');
      output.innerHTML = "Measuring...";

      const fileUrl = "https://speed.hetzner.de/5MB.bin"; // test file
      const start = new Date().getTime();

      try {
        const response = await fetch(fileUrl);
        const reader = response.body.getReader();
        let received = 0;

        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          received += chunk.value.length;
        }

        const end = new Date().getTime();
        const duration = (end - start) / 1000; // seconds
        const mbps = ((received * 8) / duration / 1024 / 1024).toFixed(2);

        output.innerHTML = `Download Speed: <b>${mbps} Mbps</b>`;
      } catch (error) {
        output.innerHTML = "Error: Could not measure speed";
      }
    }
  </script>
</body>
</html>
